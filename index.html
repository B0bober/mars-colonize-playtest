<title>Mars. Colonize — Scenario 1 Prototype</title>
<style>

.top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:16px;padding:2px 2px 10px;border-bottom:1px solid #30616a}.title h1{margin:0;font-size:clamp(29px,4vw,42px);letter-spacing:.02em;text-transform:uppercase;text-shadow:0 0 22px #55d6d155}.title h1 span{color:var(--mars)}.title p{margin:5px 0 0;color:var(--muted);font:12px/1.3 var(--data);letter-spacing:.11em;text-transform:uppercase}.mission-id{display:block;margin-bottom:4px;color:var(--accent);font:700 10px/1 var(--data);letter-spacing:.2em}.round-pills{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:7px}.pill{display:inline-flex;align-items:center;padding:6px 10px;border:1px solid #315d63;border-radius:3px;background:#091517;color:#aad2d2;font:700 12px/1.2 var(--data);letter-spacing:.04em;text-transform:uppercase}.pill.phase-pill{background:#12383a;border-color:#53c9c5;color:#bffdf8;box-shadow:0 0 18px #38c7c229}
.panel{position:relative;background:linear-gradient(145deg,#0e1c1eee,#091315f5);border:1px solid var(--line);border-radius:5px;padding:17px;box-shadow:0 16px 44px #0009,0 0 0 1px #061012 inset}.panel:after{content:"";position:absolute;right:7px;top:7px;width:18px;height:4px;border-top:1px solid #4eb6b3;border-bottom:1px solid #4eb6b3;opacity:.55}.phase-panel{overflow:hidden;border-color:#397982;background:linear-gradient(115deg,#173238 0,#0b181a 52%,#171513 100%)}.phase-panel:before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:linear-gradient(var(--accent),var(--mars));box-shadow:0 0 14px #55d6d188}.phase-header{display:grid;grid-template-columns:minmax(220px,.7fr) minmax(280px,1.3fr);gap:22px;align-items:center}.eyebrow{color:var(--accent);font:800 11px/1.2 var(--data);letter-spacing:.18em;text-transform:uppercase}.phase-header h2{margin:5px 0 0;font-size:clamp(24px,3vw,34px);letter-spacing:.01em}.phase-header p{margin:0;color:#bdd0d0;line-height:1.48}.stage-track{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin-top:15px}.stage{position:relative;padding:9px 6px;border:1px solid #214248;border-radius:2px;text-align:center;color:#628285;background:#071113;font:750 11px/1.2 var(--data);letter-spacing:.05em;text-transform:uppercase}.stage.active{border-color:var(--accent);background:#123436;color:#bffff9;box-shadow:0 0 20px #46d2cd22 inset}.stage.active:before{content:"";position:absolute;left:5px;right:5px;bottom:3px;height:2px;background:var(--accent);box-shadow:0 0 7px var(--accent)}.status{display:flex;gap:9px;margin-top:12px;padding:10px 12px;border-radius:2px;background:#050c0e;border:1px solid #22484e;color:#c8dddc;min-height:43px;line-height:1.4;font:13px/1.4 var(--data)}.status:before{content:">";color:var(--accent);font-weight:900}.toast{position:fixed;right:22px;bottom:22px;z-index:50;width:min(430px,calc(100vw - 28px));padding:13px 15px;border:1px solid var(--accent);border-radius:3px;background:#102a2dee;color:#dffffb;b .controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button,select{min-height:42px;background:#102326;color:#d9eeec;border:1px solid #35646b;border-radius:3px;padding:9px 12px;font-weight:700}button{cursor:pointer;transition:background .15s,transform .15s,border-color .15s,box-shadow .15s}button:hover:not(:disabled){background:#17383c;border-color:#55d6d1;box-shadow:0 0 15px #55d6d122;transform:translateY(-1px)}button:disabled{opacity:.32;cursor:not-allowed}.primary{background:#b85535;border-color:#ef936e;color:#fff;box-shadow:0 0 14px #da674533}.primary:hover:not(:disabled){background:#d06744}.secondary{background:#091416}
.layout{display:grid;grid-template-columns:minmax(440px,1.2fr) minmax(330px,.8fr);gap:16px;margin-top:16px;align-items:start}.play-column,.side-column{display:grid;gap:16px}.side-column{position:sticky;top:12px}.panel-title{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}.panel-title h2{margin:0;font-size:21px}.panel-title span{color:var(--muted);font-size:13px;text-align:right}

.module-bay{margin-top:16px}.hand{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:9px;min-height:92px}.card{position:relative;min-height:108px;border:1px solid #31565b;background:linear-gradient(145deg,#112427,#091517);border-radius:3px;padding:11px;display:flex;flex-direction:column;justify-content:space-between;gap:8px;box-shadow:0 0 0 1px #071012 inset}.card:before{content:"MODULE";position:absolute;right:6px;top:5px;color:#41676b;font:8px/1 var(--data);letter-spacing:.12em}.card.interactive{cursor:pointer}.card.interactive:hover{border-color:#55d6d1;box-shadow:0 0 16px #55d6d122;transform:translateY(-1px)}.card.discard{cursor:pointer}.card.recycle-selected{outline:2px solid #d86f48;outline-offset:-2px;background:linear-gradient(145deg,#382018,#17100d)}.tile-tag{width:max-content;padding:3px 5px;border:1px solid #31575c;color:#68beba;font:8px/1 var(--data);letter-spacing:.08em;text-transform:uppercase}.card small{color:#9bb5b5;font:10px/1.35 var(--data)}.hand-info{margin-top:9px;color:var(--muted);font:12px/1.3 var(--data)}
.resources{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:13px}.resource{padding:10px;background:#071113;border:1px solid #24474d;border-radius:2px;color:var(--muted);font:11px/1.2 var(--data);text-transform:uppercase}.resource b{display:block;color:#8ff3ec;font-size:18px;margin-top:4px;text-shadow:0 0 10px #55d6d144}.facilities{display:grid;gap:8px}.facility{padding:11px;border:1px solid #294d52;border-radius:2px;background:#0d1a1c}.facility-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.facility-head b{letter-spacing:.03em}.facility-head span{color:var(--muted);font:11px/1.3 var(--data);text-align:right}.worker-control{display:grid;grid-template-columns:1fr auto;gap:9px;align-items:center;margin-top:9px;padding-top:9px;border-top:1px solid #24444a}.worker-control label{color:#a7c5c5;font:11px/1.3 var(--data)}.worker-control select{min-height:38px;padding:7px 9px}.allocation-note{margin:0 0 10px;padding:9px 10px;border-radius:2px;background:#183033;border:1px solid #3e777c;color:#cce5e3;font-size:13px}.log{max-height:245px;overflow:auto;font:12px/1.45 var(--data);color:#a9c1c1}.log div{padding:6px 0;border-bottom:1px solid #1d383d}
.modal{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:22px;background:#030809e8;backdrop-filter:blur(6px)}.modal.show{display:flex}.modal-card{width:min(520px,100%);padding:25px;border:1px solid var(--gold);border-radius:4px;background:linear-gradient(145deg,#162628,#0b1517);box-shadow:0 24px 80px #000,0 0 35px #f0b75a22}.modal-card h2{margin:10px 0;font-size:28px}.modal-card p{line-height:1.5;color:#c6d7d6}.modal-card button{width:100%;margin-top:10px;padding:13px}.result-card{border-color:#46a96b;box-shadow:0 24px 80px #000,0 0 40px #46a96b33}.result-card .phase-pill{background:#173827;border-color:#46a96b;color:#c7ffda}.result-actions{display:grid;grid-template-columns:1fr 1.35fr;gap:10px;margin-top:18px}.result-actions button{margin-top:0}.card.recycle-unavailable{opacity:.38;cursor:not-allowed}.guide-modal{z-index:30}.guide-card{width:min(590px,100%)}.guide-card ul{margin:14px 0 4px;padding-left:21px;color:#c6d7d6;line-height:1.55}.guide-card li+li{margin-top:7px}.guide-progress{color:var(--gold);font:11px/1.3 var(--data);letter-spacing:.12em;text-transform:uppercase}.guide-actions{display:grid;grid-template-columns:1fr 2fr;gap:10px;margin-top:16px}.guide-actions button{margin-top:0}.phase-copy{display:grid;justify-items:end;gap:8px}.phase-copy p{margin:0}.briefing-button{min-height:32px;padding:6px 10px;border-color:#3e777c;background:#102326;color:#9dd8d4;font:11px/1 var(--data);text-transform:uppercase;letter-spacing:.08em}@keyframes pulse{50%{outline-color:#fff0b0;box-shadow:0 0 22px #f0c26b77}}
@media(max-width:860px){.app{padding:14px}.top{align-items:flex-start}.phase-copy{justify-items:start}.guide-actions,.result-actions{grid-template-columns:1fr}.layout{grid-template-columns:1fr}.side-column{position:static}.phase-header{grid-template-columns:1fr;gap:8px}.grid{max-width:620px;margin:auto}.stage-track{overflow-x:auto;grid-template-columns:repeat(7,minmax(88px,1fr))}.module-bay .hand{display:flex;overflow-x:auto;overscroll-behavior-inline:contain;scroll-snap-type:x proximity;padding-bottom:5px}.module-bay .card{flex:0 0 132px;scroll-snap-align:start}}@media(max-width:540px){.app{padding:10px}.top{display:block}.round-pills{justify-content:flex-start;margin-top:10px}.panel{padding:13px;border-radius:5px}.stage{font-size:11px}.controls button{flex:1 1 145px}.grid{gap:5px}.cell{border-radius:2px;padding:4px;font-size:11px}.cell.pending:after{font-size:7px}.resources{grid-template-columns:repeat(2,1fr)}.facility-head{display:block}.facility-head span{display:block;text-align:left;margin-top:4px}.worker-control{grid-template-columns:1fr}.worker-control select{width:100%}}
</style>
</head>
<body>
<div class="app">
  <header class="top"><div class="title"><span class="mission-id">ARES CONTROL // COLONY OPERATIONS</span><h1><span>Mars.</span> Colonize</h1><p id="scenarioSubtitle">Scenario 1 // sustainability qualification protocol</p></div><div id="roundPills" class="round-pills"></div></header>
  <section class="panel phase-panel" aria-live="polite">
    <div class="phase-header"><div><div class="eyebrow">Current stage</div><h2 id="phaseTitle">Construction</h2></div><div class="phase-copy"><p id="phaseInstruction"></p><button class="briefing-button" onclick="reopenStageBriefing()" aria-label="Open an explanation of the current stage">Stage briefing</button></div></div>
    <div id="stageTrack" class="stage-track" aria-label="Scenario stages"></div><div id="status" class="status"></div><div id="controls" class="controls"></div>
  </section>
  <section class="panel module-bay"><div class="panel-title"><h2>Module Bay</h2><span id="handCount"></span></div><div id="hand" class="hand"></div><div id="drawInfo" class="hand-info"></div></section>
  <main class="layout">
    <div class="play-column">
      <section class="panel"><div class="panel-title"><h2>Colony grid</h2><span>Tap highlighted cells to place</span></div><div id="grid" class="grid"></div><div id="arrivalBanner"></div></section>
    </div>
    <aside class="side-column">
      <section class="panel"><div class="panel-title"><h2>Colony state</h2><span id="workerSummary"></span></div><div id="resources" class="resources"></div><div id="allocationNote"></div><div id="facilities" class="facilities"></div></section>
      <section class="panel"><div class="panel-title"><h2>Turn log</h2><span>Newest first</span></div><div id="log" class="log"></div></section>
    </aside>
  </main>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="resultModal" class="modal result-modal" role="dialog" aria-modal="true" aria-labelledby="resultTitle"><div class="modal-card result-card"><div id="resultPill" class="pill phase-pill"></div><h2 id="resultTitle">Colony passed the autonomous survival test</h2><div id="resultBody"></div><div class="result-actions"><button id="resultRepeat" class="secondary" onclick="repeatScenario()"></button><button id="resultNext" class="primary" onclick="nextScenario()"></button></div></div></div>
<div id="guideModal" class="modal guide-modal" role="dialog" aria-modal="true" aria-labelledby="guideTitle"><div class="modal-card guide-card"><div id="guideProgress" class="guide-progress"></div><h2 id="guideTitle"></h2><div id="guideBody"></div><div class="guide-actions"><button id="guideSecondary" class="secondary" onclick="skipMissionBriefing()">Skip introduction</button><button id="guidePrimary" class="primary" onclick="advanceGuide()">Continue</button></div></div></div>
<script src="scenario-rules.js"></script>
<script src="scenario1-engine.js"></script>
<script>
const BOARD_SIZE=3,BOARD_CELLS=BOARD_SIZE*BOARD_SIZE,AUTONOMY_ROUNDS=10;
const TYPES={solar:{name:'Solar',need:1},water:{name:'Water',need:2},oxygen:{name:'Oxygen',need:2},battery:{name:'Battery',need:1},habitat:{name:'Habitat',need:1}};
const SCENARIO_1_BRIEFINGS=[
  {title:'Welcome to Ares Base',body:'<p>Your task is to turn a robotic landing site into a colony that can survive without you.</p><ul><li>You have four managed rounds to build essential infrastructure.</li><li>Four colonists and Landing Habitat [5] arrive in Round 4.</li><li>After setup, the colony must keep all four colonists awake through 10 autonomous rounds.</li></ul>'},
  {title:'The managed-round cycle',body:'<p>Each round follows one fixed sequence:</p><ul><li><b>Build</b> one facility, cycle the Module Bay, or pass.</li><li><b>Module Delivery</b> supplies three new modules.</li><li><b>Module Recycle</b> requires exactly the number shown, leaving no more than five modules in the Bay.</li><li>Then resolve <b>Arrival</b>, <b>Crew Allocation</b>, and <b>End Turn</b> when those stages apply.</li></ul><p>Modules received this round become available for Build next round.</p>'},
  {title:'Build a life-support loop',body:'<p>The four arriving colonists need four Water and four Oxygen every round.</p><ul><li><b>Solar:</b> produces 2 Power.</li><li><b>Water:</b> two adjacent Water modules + 2 workers + 1 Power → 4 Water.</li><li><b>Oxygen:</b> two adjacent Oxygen modules + 2 workers + 1 Power → 4 Oxygen.</li><li>Facilities resolve in construction order. Unsupported colonists enter permanent cryosleep.</li></ul><p>Placements remain provisional until you confirm them.</p>'}
];
const SCENARIO_2_BRIEFINGS=[
  {title:'Scenario 2 — Eclipse',body:'<p>The colony must now prove resilience, not just sustainability.</p><ul><li>You have <b>six managed rounds</b>.</li><li>Four colonists and Landing Habitat [5] arrive in <b>Round 5</b>.</li><li>Round 6 lets you operate and charge the completed colony before autonomy.</li></ul>'},
  {title:'Mission update: solar eclipse',body:'<p>Orbital forecasts predict a total solar eclipse during <b>Autonomy 5 of 10</b>.</p><p>Every Solar facility will produce <b>0 Power</b> for that complete round. Once autonomy begins, you cannot intervene.</p>'},
  {title:'Build resilience',body:'<p>Normal life support uses 2 Power each round. One Solar produces exactly 2 Power, leaving nothing to store.</p><ul><li>A second Solar can create 2 surplus Power.</li><li>One Battery stores up to 2 Power automatically after facilities operate.</li><li>Stored power joins the common power pool during the eclipse.</li></ul><p>The same 3×3 board is now a tight spatial puzzle.</p>'}
];
function scenarioConfig(){return ScenarioRules.getScenario(state.scenario)}
function missionBriefings(){return state.scenario===2?SCENARIO_2_BRIEFINGS:SCENARIO_1_BRIEFINGS}
const PHASE_BRIEFINGS={
  build:{title:'Build stage',body:'<p>Use modules already in the Module Bay. Choose exactly one action:</p><ul><li>Build one facility.</li><li>Cycle the entire Module Bay for replacements.</li><li>Pass and retain the current modules.</li></ul><p>Tap grid cells to preview a facility. You may move or cancel it until <b>Confirm placement</b>.</p>'},
  drop:{title:'Module Recycle',body:'<p>Select exactly the number shown to leave no more than five modules in the Module Bay, then confirm the complete batch once. The selection locks when the required number is reached; deselect one to change it.</p>'},
  arrival:{title:'Arrival stage',body:'<p>Place Landing Habitat [5] on an empty cell connected to the Starport by an unbroken orthogonal path of occupied cells. The four colonists deploy only after confirmation.</p>'},
  allocation:{title:'Crew Allocation',body:'<p>Assign awake colonists to operational facilities. Water and Oxygen each require their full complement of two workers; partial staffing produces nothing.</p><p>You may revise assignments until you finish the stage. If nobody is assigned, the console will ask for confirmation.</p>'},
  end:{title:'End Turn',body:'<p>Review the colony before committing the round. Ending the turn resolves production in construction order, then life-support consumption, battery charging, and any cryosleep.</p>'},
  ready:{title:'Autonomy test',body:'<p>Managed construction is over. Launching autonomy locks the colony and simulates 10 rounds without intervention.</p><p><b>Success:</b> all four colonists remain awake for every autonomous round.</p>'}
};
function phaseBriefing(key){if(key==='ready'&&state.scenario===2)return{title:'Autonomy test — Eclipse',body:'<p>Launching autonomy locks the colony and simulates 10 rounds without intervention.</p><p><b>Forecast:</b> Autonomy 5 is a total solar eclipse. All Solar production becomes 0 for that round, so stored Battery power must carry life support.</p><p><b>Success:</b> all four colonists remain awake for all 10 rounds.</p>'};return PHASE_BRIEFINGS[key]}
const guideState={mode:null,introIndex:0,shownPhases:new Set()};
const state={scenario:1,round:1,phase:'build',deck:[],discard:[],hand:[],board:Array(BOARD_CELLS).fill(null),facilities:[],buildOrder:0,selectedBuild:null,pendingCells:[],pendingLanding:null,buildSpent:false,discardRequired:0,pendingRecycle:[],arrivalPending:false,arrivalAcknowledged:false,arrived:false,awake:0,cryo:0,battery:0,lastPower:0,lastWater:0,lastOxygen:0,allocationTouched:false,autonomy:false,eclipseOccurred:false,result:null,resultAcknowledged:false,message:'',log:[]};
state.board[0]={kind:'starport',label:'STARPORT'};
let toastTimer=null;
function showNotice(message){const toast=document.getElementById('toast');toast.textContent=message;toast.classList.add('show');if(toastTimer)clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),3200)}
function showGuide(title,body,progress,primaryLabel,secondaryVisible=true){guideState.mode=guideState.mode||'phase';document.getElementById('guideTitle').textContent=title;document.getElementById('guideBody').innerHTML=body;document.getElementById('guideProgress').textContent=progress;document.getElementById('guidePrimary').textContent=primaryLabel;document.getElementById('guideSecondary').style.display=secondaryVisible?'block':'none';document.getElementById('guideModal').classList.add('show');document.body.style.overflow='hidden'}
function startMissionBriefing(){guideState.mode='intro';guideState.introIndex=0;renderIntroBriefing()}
function renderIntroBriefing(){const briefings=missionBriefings(),briefing=briefings[guideState.introIndex],last=guideState.introIndex===briefings.length-1;showGuide(briefing.title,briefing.body,`SCENARIO ${state.scenario} BRIEFING // ${guideState.introIndex+1} OF ${briefings.length}`,last?`Begin Scenario ${state.scenario}`:'Continue',true)}
function advanceGuide(){if(guideState.mode==='intro'){if(guideState.introIndex<missionBriefings().length-1){guideState.introIndex++;renderIntroBriefing();return}closeGuide();return}closeGuide()}
function skipMissionBriefing(){closeGuide()}
function closeGuide(){document.getElementById('guideModal').classList.remove('show');document.body.style.overflow='';guideState.mode=null}
function phaseBriefingKey(){if(state.phase==='autonomy'||state.phase==='result')return null;return state.phase}
function openPhaseBriefing(key){const briefing=phaseBriefing(key);if(!briefing)return;guideState.mode='phase';showGuide(briefing.title,briefing.body,`SCENARIO ${state.scenario} STAGE GUIDE // ROUND ${state.round}`,'Close briefing',false)}
function reopenStageBriefing(){const key=phaseBriefingKey();if(key&&phaseBriefing(key))openPhaseBriefing(key)}
let lastDeckAttempts=1;
function makeDeck(){const result=Scenario1Engine.createSolvableDeck();lastDeckAttempts=result.attempts;return result.cards}
function shuffle(cards){return Scenario1Engine.shuffleInPlace(cards)}
function drawOne(){if(!state.deck.length){if(!state.discard.length)return null;state.deck=shuffle(state.discard.splice(0));addLog('Recycle reserve reloaded into Module Supply.')}return state.deck.pop()||null}
